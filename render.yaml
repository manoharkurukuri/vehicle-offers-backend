services:
  - type: web
    name: vehicle-offers-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # FastAPI only now; scraping runs in AWS Lambda.
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    # Persistent disk keeps the SQLite DB and generated .xlsx files across deploys.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: AWS_REGION
        value: ap-south-2
      - key: SCRAPER_LAMBDA_NAME
        value: vehicle_offer_scraper
      - key: DATABASE_URL
        value: sqlite:////var/data/vehicle_offers.db
      - key: LOCAL_STORAGE_DIR
        value: /var/data/offers
      # Secrets: leave unset here and add them in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
